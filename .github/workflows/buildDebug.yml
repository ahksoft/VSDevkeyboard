name: Debug Build
on:
  workflow_dispatch:

jobs:
  build-debug:
    name: Build Debug
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # FIX: Use this action to install Gradle if your wrapper is missing
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper # or specify a version like '8.5'

      - name: Set Commit Hash
        id: commit_hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # FIX: Call 'gradle' directly instead of './gradlew' if using the step above
      - name: Build with Gradle
        run: gradle assembleDebug && mv app/build/outputs/apk/debug/*.apk app/vs-keyboard-${{ env.COMMIT_HASH }}.apk

      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: VS-keyboard-Release
          path: app/vs-keyboard-${{ env.COMMIT_HASH }}.apk
